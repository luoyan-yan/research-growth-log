<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扫码试用 · 科研生长日志</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #241426;
        --muted: #706777;
        --paper: #faf8fb;
        --plum: #5b4275;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(207, 189, 233, 0.38), transparent 28%),
          radial-gradient(circle at bottom right, rgba(219, 230, 198, 0.42), transparent 22%),
          var(--paper);
      }

      .card {
        width: min(520px, 100%);
        padding: 36px 28px 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(55, 35, 65, 0.12);
        box-shadow: 0 18px 40px rgba(87, 67, 93, 0.08);
        text-align: center;
      }

      .pill {
        display: inline-block;
        margin-bottom: 14px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(203, 188, 229, 0.35);
        color: var(--plum);
        font-size: 0.85rem;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }

      .hint {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.6;
      }

      .qr-wrap {
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        padding: 18px;
        width: fit-content;
        border-radius: 22px;
        background: #fff;
        border: 1px solid rgba(55, 35, 65, 0.1);
      }

      .qr-wrap img {
        width: min(280px, 70vw);
        height: auto;
        display: block;
      }

      .url {
        word-break: break-all;
        margin: 0 0 18px;
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(243, 239, 248, 0.9);
        color: var(--plum);
        font-size: 0.95rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }

      a.btn {
        text-decoration: none;
        color: #fff;
        background: #2a1d2d;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 600;
      }

      a.btn.secondary {
        color: var(--ink);
        background: rgba(203, 188, 229, 0.35);
      }

      .note {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="pill">手机扫码即可试用</div>
      <h1>科研生长日志</h1>
      <p class="hint">用手机摄像头扫下面二维码，打开后即可记录。</p>

      <div class="qr-wrap">
        <img
          src="./qr.png"
          width="280"
          height="280"
          alt="科研生长日志公开试用二维码"
        />
      </div>

      <p class="url" id="share-url">https://luoyan-yan.github.io/research-growth-log/</p>

      <div class="actions">
        <a class="btn" href="./index.html">打开应用</a>
        <a class="btn secondary" href="https://luoyan-yan.github.io/research-growth-log/" target="_blank" rel="noopener">在新标签打开</a>
      </div>

      <p class="note">记录保存在每人自己的手机浏览器中，不会互相看见。</p>
    </main>
  </body>
</html>
